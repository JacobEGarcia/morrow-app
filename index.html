<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORROW — plan your energy</title>
<meta name="description" content="A day planner that schedules around your energy, not your hours.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013; --ink:#e9e7e2; --dim:#787c84; --line:#22262c;
    --deep:#f0874f; --light:#7cc7a3; --restore:#8f9ff0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    display:flex;justify-content:center;padding:0 20px 80px;
  }
  .wrap{width:100%;max-width:720px}
  header{padding:52px 0 6px;display:flex;align-items:baseline;justify-content:space-between}
  h1{font-size:20px;letter-spacing:.35em;font-weight:600}
  .date{font-size:11px;color:var(--dim)}
  .tagline{color:var(--dim);font-size:12px;padding-bottom:26px;border-bottom:1px solid var(--line)}

  /* composer */
  .composer{margin-top:26px;border:1px solid var(--line);border-radius:8px;padding:16px}
  .composer input[type=text]{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:16px;padding:8px 2px 12px;outline:none;
  }
  .composer input::placeholder{color:#4c5058}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .ebtn,.add{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;letter-spacing:.06em;
  }
  .ebtn:hover{color:var(--ink);border-color:#3a4048}
  .ebtn.on[data-e="deep"]{color:var(--deep);border-color:var(--deep)}
  .ebtn.on[data-e="light"]{color:var(--light);border-color:var(--light)}
  .ebtn.on[data-e="restore"]{color:var(--restore);border-color:var(--restore)}
  select{
    background:var(--bg);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:11px;padding:6px 8px;border-radius:6px;
  }
  .add{margin-left:auto;color:var(--ink);border-color:#3a4048}
  .add:hover{background:#171a1f}

  /* columns */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:30px}
  @media(max-width:680px){.cols{grid-template-columns:1fr}}
  h2{font-size:11px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin-bottom:12px;font-weight:400}
  ul{list-style:none}
  li.task{
    display:flex;gap:10px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line);
  }
  .pip{flex:0 0 auto;width:8px;height:8px;border-radius:50%;transform:translateY(-1px)}
  .pip.deep{background:var(--deep)} .pip.light{background:var(--light)} .pip.restore{background:var(--restore)}
  .t-body{flex:1;min-width:0}
  .t-name{font-size:14px;line-height:1.4;word-wrap:break-word}
  .done .t-name{text-decoration:line-through;color:var(--dim)}
  .t-meta{font-size:10px;color:var(--dim);margin-top:3px}
  .t-meta .el.deep{color:var(--deep)} .t-meta .el.light{color:var(--light)} .t-meta .el.restore{color:var(--restore)}
  .acts{display:flex;gap:10px}
  .acts button{background:none;border:none;color:#4c5058;font:inherit;font-size:10px;cursor:pointer}
  .acts button:hover{color:var(--ink)}
  .empty{color:#4c5058;font-size:12px;padding:26px 0}

  /* timeline */
  .plan-btn{
    width:100%;margin:8px 0 18px;background:transparent;border:1px solid #3a4048;color:var(--ink);
    font:inherit;font-size:12px;padding:12px;border-radius:8px;cursor:pointer;letter-spacing:.15em;
  }
  .plan-btn:hover{background:#171a1f}
  .curve-note{font-size:10px;color:var(--dim);margin-bottom:14px;line-height:1.6}
  .curve-note b{color:var(--ink);font-weight:400;cursor:pointer;text-decoration:underline}
  #day{border-left:1px solid var(--line);position:relative;margin-left:44px}
  .slot{position:relative;height:34px;border-bottom:1px dashed #1a1d22;font-size:0}
  .hour-label{
    position:absolute;left:-44px;top:-6px;width:36px;text-align:right;
    font-size:9px;color:#4c5058;
  }
  .block{
    position:absolute;left:6px;right:6px;border-radius:5px;font-size:11px;
    padding:4px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    cursor:pointer;opacity:.92;border:1px solid transparent;
  }
  .block.deep{background:rgba(240,135,79,.13);border-color:rgba(240,135,79,.4);color:var(--deep)}
  .block.light{background:rgba(124,199,163,.11);border-color:rgba(124,199,163,.35);color:var(--light)}
  .block.restore{background:rgba(143,159,240,.11);border-color:rgba(143,159,240,.35);color:var(--restore)}
  .block.done{opacity:.35;text-decoration:line-through}
  .nowline{position:absolute;left:0;right:0;height:1px;background:#e5534b;z-index:2}
  .nowline::after{content:"now";position:absolute;right:0;top:-12px;font-size:9px;color:#e5534b}
  footer{margin-top:56px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  footer button{background:none;border:none;color:var(--dim);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline}
  footer button:hover{color:var(--ink)}
  dialog{
    background:#14171c;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:22px;font:inherit;max-width:340px;
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog .row{justify-content:flex-end}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MORROW</h1>
    <span class="date" id="date"></span>
  </header>
  <div class="tagline">plan your energy, not your hours</div>

  <div class="composer">
    <input type="text" id="taskInput" placeholder="what needs doing?" autocomplete="off">
    <div class="row">
      <button class="ebtn on" data-e="deep">deep</button>
      <button class="ebtn" data-e="light">light</button>
      <button class="ebtn" data-e="restore">restore</button>
      <select id="dur">
        <option value="30">30 min</option>
        <option value="60" selected>1 hour</option>
        <option value="90">90 min</option>
        <option value="120">2 hours</option>
      </select>
      <button class="add" id="addBtn">+ add</button>
    </div>
  </div>

  <div class="cols">
    <section>
      <h2>Unplaced</h2>
      <ul id="pool"></ul>
      <div class="empty" id="poolEmpty" hidden>nothing unplaced</div>
      <button class="plan-btn" id="planBtn">PLAN MY DAY →</button>
    </section>
    <section>
      <h2>Today</h2>
      <div class="curve-note" id="curveNote"></div>
      <div id="day"></div>
    </section>
  </div>

  <footer>
    <span>your day lives in this browser · nothing leaves the device</span>
    <button id="resetBtn">clear day</button>
  </footer>
</div>

<dialog id="peakDlg">
  <p style="font-size:13px;line-height:1.6">When is your deep-work peak?</p>
  <div class="row" style="margin-top:16px">
    <select id="peakSel">
      <option value="8">early — 8–11</option>
      <option value="9" selected>morning — 9–12</option>
      <option value="13">afternoon — 1–4</option>
      <option value="20">night — 8–11</option>
    </select>
    <button class="ebtn" id="peakSave">save</button>
  </div>
</dialog>

<script>
(function(){
  var KEY='morrow.v1';
  var DAY_START=6, DAY_END=23; // 6am - 11pm
  var state=load();
  var energy='deep';

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY));
      if(s && s.day===todayKey()) return s;
    }catch(e){}
    return {day:todayKey(), peak:9, tasks:[], nextId:1};
  }
  function save(){ localStorage.setItem(KEY,JSON.stringify(state)) }
  function todayKey(){ return new Date().toDateString() }

  // energy curve: deep around peak (3h), light midday shoulders, restore evening
  function curveFor(hour){
    var p=state.peak;
    if(hour>=p && hour<p+3) return 'deep';
    if(hour>=21 || hour<DAY_START+1) return 'restore';
    return 'light';
  }

  var taskInput=document.getElementById('taskInput'),
      pool=document.getElementById('pool'),
      day=document.getElementById('day');

  document.getElementById('date').textContent=
    new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

  document.querySelectorAll('.ebtn[data-e]').forEach(function(b){
    b.onclick=function(){
      energy=b.dataset.e;
      document.querySelectorAll('.ebtn[data-e]').forEach(function(x){x.classList.toggle('on',x===b)});
    };
  });

  function add(){
    var name=taskInput.value.trim(); if(!name) return;
    state.tasks.push({id:state.nextId++,name:name,energy:energy,dur:+document.getElementById('dur').value,start:null,done:false});
    taskInput.value=''; save(); render();
  }
  document.getElementById('addBtn').onclick=add;
  taskInput.addEventListener('keydown',function(e){if(e.key==='Enter')add()});

  document.getElementById('planBtn').onclick=function(){
    // clear placed (keep done history out of the way), then greedily place into matching-energy free hours
    var placed=state.tasks.filter(function(t){return t.start!=null});
    var unplaced=state.tasks.filter(function(t){return t.start==null});
    var used={};
    placed.forEach(function(t){
      for(var m=t.start;m<t.start+t.dur/60;m+=0.5) used[m]=1;
    });
    var order={deep:0,light:1,restore:2};
    unplaced.sort(function(a,b){return order[a.energy]-order[b.energy]});
    var nowH=new Date().getHours()+new Date().getMinutes()/60;
    unplaced.forEach(function(t){
      var slots=[];
      for(var h=DAY_START;h<=DAY_END-t.dur/60;h+=0.5){
        if(h<nowH) continue;
        var fit=true;
        for(var m=h;m<h+t.dur/60;m+=0.5){ if(used[m]){fit=false;break} }
        if(!fit) continue;
        slots.push(h);
      }
      if(!slots.length) return;
      // prefer matching curve, earliest first
      var match=slots.filter(function(h){return curveFor(h)===t.energy});
      var pick=(match.length?match:slots)[0];
      t.start=pick;
      for(var m=pick;m<pick+t.dur/60;m+=0.5) used[m]=1;
    });
    save(); render();
  };

  document.getElementById('resetBtn').onclick=function(){
    if(!confirm('clear the whole day?')) return;
    state={day:todayKey(),peak:state.peak,tasks:[],nextId:1};
    save(); render();
  };

  var dlg=document.getElementById('peakDlg');
  document.getElementById('curveNote').innerHTML=
    'deep hours in <b id="peakEdit">'+peakLabel()+'</b> · light fills the middle · restore after 9pm · tap a block to finish it';
  document.getElementById('peakEdit').onclick=function(){
    document.getElementById('peakSel').value=String(state.peak); dlg.showModal();
  };
  document.getElementById('peakSave').onclick=function(){
    state.peak=+document.getElementById('peakSel').value; save(); dlg.close(); render();
  };
  function peakLabel(){
    var p=state.peak,f=function(h){return h>12?(h-12)+'pm':(h===12?'12pm':h+'am')};
    return f(p)+'–'+f(p+3);
  }

  function fmtHour(h){
    var hh=Math.floor(h),mm=h%1?':30':':00',ap=hh>=12?'pm':'am',h12=hh%12||12;
    return h12+mm+ap;
  }

  function render(){
    document.getElementById('peakEdit').textContent=peakLabel();
    // pool
    pool.innerHTML='';
    var unplaced=state.tasks.filter(function(t){return t.start==null});
    unplaced.forEach(function(t){
      var li=document.createElement('li'); li.className='task'+(t.done?' done':'');
      li.innerHTML='<span class="pip '+t.energy+'"></span>';
      var b=document.createElement('div'); b.className='t-body';
      var n=document.createElement('div'); n.className='t-name'; n.textContent=t.name;
      var m=document.createElement('div'); m.className='t-meta';
      m.innerHTML='<span class="el '+t.energy+'">'+t.energy+'</span> · '+(t.dur>=60?(t.dur/60)+'h':t.dur+'m');
      b.appendChild(n); b.appendChild(m);
      var acts=document.createElement('div'); acts.className='acts';
      var dn=document.createElement('button'); dn.textContent=t.done?'undo':'done';
      dn.onclick=function(){t.done=!t.done;save();render()};
      var rm=document.createElement('button'); rm.textContent='drop';
      rm.onclick=function(){state.tasks=state.tasks.filter(function(x){return x.id!==t.id});save();render()};
      acts.appendChild(dn); acts.appendChild(rm);
      li.appendChild(b); li.appendChild(acts);
      pool.appendChild(li);
    });
    document.getElementById('poolEmpty').hidden=unplaced.length>0;

    // timeline
    day.innerHTML='';
    for(var h=DAY_START;h<DAY_END;h++){
      for(var half=0;half<2;half++){
        var s=document.createElement('div'); s.className='slot';
        if(half===0){
          var l=document.createElement('span'); l.className='hour-label'; l.textContent=fmtHour(h);
          s.appendChild(l);
        }
        day.appendChild(s);
      }
    }
    var slotH=34;
    state.tasks.filter(function(t){return t.start!=null}).forEach(function(t){
      var b=document.createElement('div');
      b.className='block '+t.energy+(t.done?' done':'');
      b.style.top=((t.start-DAY_START)*2*slotH)+'px';
      b.style.height=((t.dur/60)*2*slotH-4)+'px';
      b.textContent=fmtHour(t.start)+'  '+t.name;
      b.title='tap to toggle done';
      b.onclick=function(){t.done=!t.done;save();render()};
      day.appendChild(b);
    });
    var now=new Date(), nowH=now.getHours()+now.getMinutes()/60;
    if(nowH>=DAY_START&&nowH<DAY_END){
      var nl=document.createElement('div'); nl.className='nowline';
      nl.style.top=((nowH-DAY_START)*2*slotH)+'px';
      day.appendChild(nl);
    }
  }
  render();
  setInterval(render,60000);
})();
</script>
</body>
</html>
